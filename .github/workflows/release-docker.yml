name: Docker Build and Push

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f # v6
      - name: Install cosign
        uses: sigstore/cosign-installer@3094a48ba06382e0e6cfa5a4af4fcc55fc6942b9 # v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@288220e341e5c445ddb6d73e19a57a9012ceca88 # v3
        with:
          platforms: arm64,amd64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@5b9cf3909b54a280b6df6eee035755eb1f2fd611 # v3
      - name: Log into registry
        uses: docker/login-action@c66a8fcb2472d4283042d726b2a061b43b3f49ab # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@703896b4f30f62d53f5530a80bcdc589a3f702bc # v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@cb941d0b895b09c17fa011d41c411b33c752cf28 # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Scan image
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # master 2026-07-12
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@b1b13de3df818f1657380c7d558539b493c17f2b # v0
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository }}@${{ steps.build.outputs.digest }}
          artifact-name: copilot-api.spdx.json
          output-file: copilot-api.spdx.json
      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
