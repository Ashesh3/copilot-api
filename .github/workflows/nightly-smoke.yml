name: Nightly Smoke Tests

on:
  schedule:
    - cron: "0 0 * * *" # midnight UTC
  workflow_dispatch: # manual trigger

permissions:
  contents: read

jobs:
  smoke:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966 # v6
        with:
          node-version: "22"

      - name: Install dependencies & build
        run: bun install --frozen-lockfile && bun run build

      - name: Start copilot-api
        run: |
          bun run dist/main.js start -g "$GH_TOKEN" --host 0.0.0.0 --debug \
            > tests/smoke/server.log 2>&1 &
          echo "Waiting for server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4141/v1/models > /dev/null 2>&1; then
              echo "Server is up (models loaded)"
              break
            fi
            echo "  attempt $i/30..."
            sleep 3
          done
          # Print available models for debugging
          echo "--- Available models ---"
          curl -sf http://localhost:4141/v1/models | python3 -c "import sys,json; [print(f'  {m[\"id\"]}') for m in json.load(sys.stdin)['data']]" || true
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Install CLI tools
        run: |
          npm i -g @anthropic-ai/claude-code@latest &
          npm i -g @openai/codex@latest &
          npm i -g @google/gemini-cli@latest &
          wait
          echo "--- Installed versions ---"
          claude --version || echo "claude not found"
          codex --version || echo "codex not found"
          gemini --version || echo "gemini not found"

      - name: Run smoke tests
        run: |
          chmod +x tests/smoke/run-smoke-tests.sh
          tests/smoke/run-smoke-tests.sh http://localhost:4141
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Print server logs
        if: always()
        run: |
          echo "=== copilot-api server logs ==="
          cat tests/smoke/server.log 2>/dev/null || echo "No server log found"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smoke-test-logs
          path: tests/smoke/server.log
          retention-days: 7
          if-no-files-found: ignore
