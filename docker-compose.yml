services:
  copilot-api:
    build: .
    container_name: copilot-api
    cpu_shares: 16384
    restart: unless-stopped
    ports:
      - "127.0.0.1:4141:4141"
    volumes:
      - copilot-data:/app/data
    environment:
      - OP_TOKEN=${OP_TOKEN}
      - OP_ENV_ID=${OP_ENV_ID}
      # Exact Docker bridge gateway used by host nginx on this deployment.
      - COPILOT_TRUSTED_PROXY_CIDRS=${COPILOT_TRUSTED_PROXY_CIDRS:-172.19.0.1/32,127.0.0.1/32,::1/128}
      - COPILOT_ADMIN_ORIGIN=${COPILOT_ADMIN_ORIGIN:-https://ai.ashesh.dev}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4141/health/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  copilot-data:
    # Volume was created manually before first `compose up` (see setup.md §5)
    # so compose treats it as external — won't try to create or delete it,
    # and won't warn about the missing compose labels.
    name: copilot-api_copilot-data
    external: true
