services:
  copilot-api:
    build: .
    container_name: copilot-api
    cpu_shares: 16384
    restart: unless-stopped
    ports:
      - "127.0.0.1:4141:4141"
    volumes:
      - copilot-data:/app/data
    environment:
      - OP_TOKEN=${OP_TOKEN}
      - OP_ENV_ID=${OP_ENV_ID}
      # Set the exact host-side proxy peer for reverse-proxied deployments.
      - COPILOT_TRUSTED_PROXY_CIDRS=${COPILOT_TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}
      # Leave unset for localhost; set the exact external dashboard origin.
      - COPILOT_ADMIN_ORIGIN=${COPILOT_ADMIN_ORIGIN:-}
    env_file:
      - .env
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4141/health/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  copilot-data:
    # Create once before first `compose up` (see README: Docker Compose).
    # so compose treats it as external — won't try to create or delete it,
    # and won't warn about the missing compose labels.
    name: copilot-api_copilot-data
    external: true
